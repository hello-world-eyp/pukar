<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1B263B"/>
      <stop offset="70%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#090E1A"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="50%" stop-color="#C69234"/>
      <stop offset="100%" stop-color="#F2D679"/>
    </linearGradient>
    <pattern id="folkTrellis" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 0,30 L 30,0 L 60,30 L 30,60 Z" fill="none" stroke="#24334C" stroke-width="1.2"/>
      <circle cx="30" cy="30" r="3" fill="#C69234" opacity="0.6"/>
      <path d="M 30,22 Q 25,27 30,30 Q 35,27 30,22 Z" fill="#2E7E7A" opacity="0.7"/>
      <path d="M 30,38 Q 25,33 30,30 Q 35,33 30,38 Z" fill="#2E7E7A" opacity="0.7"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="900" rx="36" fill="url(#bgGlow)"/>

  <!-- Trellis Pattern Inset -->
  <rect x="28" y="28" width="544" height="844" rx="26" fill="url(#folkTrellis)"/>

  <!-- Outer Double Gold Frame -->
  <rect x="22" y="22" width="556" height="856" rx="28" fill="none" stroke="url(#goldGrad)" stroke-width="3.5"/>
  <rect x="34" y="34" width="532" height="832" rx="20" fill="none" stroke="#C69234" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="42" y="42" width="516" height="816" rx="16" fill="none" stroke="#E5C158" stroke-width="2"/>

  <!-- Corner Flourishes (Top-Left) -->
  <g transform="translate(42, 42)">
    <path d="M 4,4 L 40,4 Q 10,10 4,40 Z" fill="#C69234"/>
    <circle cx="20" cy="20" r="5" fill="#D03D32"/>
    <circle cx="36" cy="12" r="3" fill="#2E7E7A"/>
    <circle cx="12" cy="36" r="3" fill="#2E7E7A"/>
  </g>
  <!-- Top-Right -->
  <g transform="translate(558, 42) scale(-1, 1)">
    <path d="M 4,4 L 40,4 Q 10,10 4,40 Z" fill="#C69234"/>
    <circle cx="20" cy="20" r="5" fill="#D03D32"/>
    <circle cx="36" cy="12" r="3" fill="#2E7E7A"/>
    <circle cx="12" cy="36" r="3" fill="#2E7E7A"/>
  </g>
  <!-- Bottom-Left -->
  <g transform="translate(42, 858) scale(1, -1)">
    <path d="M 4,4 L 40,4 Q 10,10 4,40 Z" fill="#C69234"/>
    <circle cx="20" cy="20" r="5" fill="#D03D32"/>
    <circle cx="36" cy="12" r="3" fill="#2E7E7A"/>
    <circle cx="12" cy="36" r="3" fill="#2E7E7A"/>
  </g>
  <!-- Bottom-Right -->
  <g transform="translate(558, 858) scale(-1, -1)">
    <path d="M 4,4 L 40,4 Q 10,10 4,40 Z" fill="#C69234"/>
    <circle cx="20" cy="20" r="5" fill="#D03D32"/>
    <circle cx="36" cy="12" r="3" fill="#2E7E7A"/>
    <circle cx="12" cy="36" r="3" fill="#2E7E7A"/>
  </g>

  <!-- Center Medallion Shield -->
  <g transform="translate(300, 450)">
    <!-- Aura Rays -->
    <circle cx="0" cy="0" r="160" fill="#0A101C" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="0" cy="0" r="148" fill="none" stroke="#D03D32" stroke-width="2" stroke-dasharray="6,4"/>
    <circle cx="0" cy="0" r="140" fill="#121B2A" stroke="#2E7E7A" stroke-width="2.5"/>

    <!-- Folk Botanical Wreath surrounding Center -->
    <path d="M 0,-128 C -70,-128 -120,-70 -120,0 C -120,70 -70,128 0,128 C 70,128 120,70 120,0 C 120,-70 70,-128 0,-128 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    
    <!-- Four Card Suits in Compass directions -->
    <!-- Spade (Top) -->
    <g transform="translate(0, -96) scale(0.45)">
      <path d="M 0,-40 C -22,-14 -38,10 -38,24 C -38,36 -24,40 -12,38 C -4,36 0,26 0,26 C 0,26 4,36 14,38 C 26,40 40,36 40,24 C 40,10 24,-14 0,-40 Z" fill="#E5C158"/>
      <path d="M -6,26 L -16,46 L 16,46 L 6,26 Z" fill="#E5C158"/>
    </g>
    <!-- Heart (Bottom) -->
    <g transform="translate(0, 96) scale(0.45)">
      <path d="M 0,38 C -4,34 -38,10 -38,-14 C -38,-30 -22,-40 0,-24 C 22,-40 38,-30 38,-14 C 38,10 4,34 0,38 Z" fill="#D03D32"/>
    </g>
    <!-- Diamond (Left) -->
    <g transform="translate(-96, 0) scale(0.42)">
      <path d="M 0,-38 L 32,0 L 0,38 L -32,0 Z" fill="#D03D32"/>
    </g>
    <!-- Club (Right) -->
    <g transform="translate(96, 0) scale(0.42)">
      <circle cx="0" cy="-16" r="18" fill="#E5C158"/>
      <circle cx="-16" cy="10" r="18" fill="#E5C158"/>
      <circle cx="16" cy="10" r="18" fill="#E5C158"/>
      <path d="M -6,10 L -14,38 L 14,38 L 6,10 Z" fill="#E5C158"/>
    </g>

    <!-- Center Oval Cartouche -->
    <ellipse cx="0" cy="0" rx="95" ry="60" fill="#0B121E" stroke="url(#goldGrad)" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="87" ry="52" fill="none" stroke="#2E7E7A" stroke-width="1.5"/>

    <!-- PUKAR Text -->
    <text x="0" y="10" font-family="Cinzel, Georgia, serif" font-size="34" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="9">PUKAR</text>

    <!-- Stars above and below text -->
    <path d="M 0,-28 L 3,-22 L 9,-22 L 4,-18 L 6,-12 L 0,-16 L -6,-12 L -4,-18 L -9,-22 L -3,-22 Z" fill="#E5C158"/>
    <path d="M 0,34 L 3,28 L 9,28 L 4,24 L 6,18 L 0,22 L -6,18 L -4,24 L -9,28 L -3,28 Z" fill="#E5C158"/>
  </g>
</svg>