<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF7EE"/>
      <stop offset="100%" stop-color="#F4EFE0"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect x="20" y="20" width="560" height="860" rx="34" fill="url(#bgGrad)" stroke="#D8D1BE" stroke-width="3" filter="url(#cardShadow)"/>

  <!-- Ornate Corner Frame Lines -->
  <!-- Top-Right Frame -->
  <path d="M 430,70 L 520,70 C 526,70 530,74 530,80 L 530,170" fill="none" stroke="#C53929" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="530" cy="70" r="4.5" fill="#C53929"/>
  <!-- Bottom-Left Frame -->
  <path d="M 170,830 L 80,830 C 74,830 70,826 70,820 L 70,730" fill="none" stroke="#C53929" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="70" cy="830" r="4.5" fill="#C53929"/>

  <!-- Top-Left Corner Index -->
  <g transform="translate(68, 60)">
    <text x="0" y="55" font-family="'system-ui', -apple-system, 'Georgia', serif" font-weight="900" font-size="62" fill="#C53929" text-anchor="middle">J</text>
    
    <g transform="translate(0, 95) scale(0.42) ">
      <!-- Outer Diamond Body -->
      <path d="M 0,-48 L 38,0 L 0,48 L -38,0 Z" 
            fill="#C53929" stroke="#8F2218" stroke-width="2"/>
      <!-- Geometric Gem Facets inside -->
      <path d="M 0,-34 L 24,0 L 0,34 L -24,0 Z" fill="#E06D53"/>
      <path d="M 0,-20 L 14,0 L 0,20 L -14,0 Z" fill="#D6A449"/>
      <circle cx="0" cy="0" r="4" fill="#E8C57A"/>
      <circle cx="0" cy="-34" r="2.5" fill="#2A6F6D"/>
      <circle cx="0" cy="34" r="2.5" fill="#2A6F6D"/>
    </g>
  
  </g>

  <!-- Bottom-Right Corner Index (Inverted) -->
  <g transform="translate(532, 840) rotate(180)">
    <text x="0" y="55" font-family="'system-ui', -apple-system, 'Georgia', serif" font-weight="900" font-size="62" fill="#C53929" text-anchor="middle">J</text>
    
    <g transform="translate(0, 95) scale(0.42) ">
      <!-- Outer Diamond Body -->
      <path d="M 0,-48 L 38,0 L 0,48 L -38,0 Z" 
            fill="#C53929" stroke="#8F2218" stroke-width="2"/>
      <!-- Geometric Gem Facets inside -->
      <path d="M 0,-34 L 24,0 L 0,34 L -24,0 Z" fill="#E06D53"/>
      <path d="M 0,-20 L 14,0 L 0,20 L -14,0 Z" fill="#D6A449"/>
      <circle cx="0" cy="0" r="4" fill="#E8C57A"/>
      <circle cx="0" cy="-34" r="2.5" fill="#2A6F6D"/>
      <circle cx="0" cy="34" r="2.5" fill="#2A6F6D"/>
    </g>
  
  </g>

  <!-- Center Artwork -->
  
    <!-- Jack Illustration -->
    <g transform="translate(300, 450)">
      <!-- Arch Frame -->
      <path d="M -140,-210 C -140,-260 140,-260 140,-210 L 140,240 L -140,240 Z" fill="#FAF7EE" stroke="#C53929" stroke-width="3"/>
      <!-- Adventure Jacket / Tunic -->
      <path d="M -115,240 Q -125,90 0,90 Q 125,90 115,240 Z" fill="#E06D53" stroke="#1A2438" stroke-width="4"/>
      <!-- Patterned Sweater Inset -->
      <path d="M -50,100 L 50,100 L 65,240 L -65,240 Z" fill="#D6A449" stroke="#1A2438" stroke-width="3"/>
      <!-- Young Boy Head -->
      <ellipse cx="0" cy="-10" rx="42" ry="46" fill="#FCE8D4" stroke="#1A2438" stroke-width="3"/>
      <!-- Cheerful Face -->
      <circle cx="-14" cy="-14" r="4" fill="#1A2438"/>
      <circle cx="14" cy="-14" r="4" fill="#1A2438"/>
      <circle cx="-24" cy="-2" r="6" fill="#F8B195" opacity="0.6"/>
      <circle cx="24" cy="-2" r="6" fill="#F8B195" opacity="0.6"/>
      <path d="M -14,14 Q 0,26 14,14" fill="none" stroke="#1A2438" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Knit Beanie with Feather -->
      <path d="M -46,-20 C -48,-80 48,-80 46,-20 Z" fill="#2A6F6D" stroke="#1A2438" stroke-width="3"/>
      <!-- Feather -->
      <path d="M 28,-60 C 50,-95 75,-90 60,-65 C 50,-55 35,-55 28,-60 Z" fill="#E76F51" stroke="#1A2438" stroke-width="2.5"/>
      <!-- Adventure Staff -->
      <g transform="translate(-95, 60)">
        <line x1="0" y1="-180" x2="0" y2="130" stroke="#6F4E37" stroke-width="7" stroke-linecap="round"/>
        
    <g transform="translate(0, -190) scale(0.65) ">
      <!-- Outer Diamond Body -->
      <path d="M 0,-48 L 38,0 L 0,48 L -38,0 Z" 
            fill="#C53929" stroke="#8F2218" stroke-width="2"/>
      <!-- Geometric Gem Facets inside -->
      <path d="M 0,-34 L 24,0 L 0,34 L -24,0 Z" fill="#E06D53"/>
      <path d="M 0,-20 L 14,0 L 0,20 L -14,0 Z" fill="#D6A449"/>
      <circle cx="0" cy="0" r="4" fill="#E8C57A"/>
      <circle cx="0" cy="-34" r="2.5" fill="#2A6F6D"/>
      <circle cx="0" cy="34" r="2.5" fill="#2A6F6D"/>
    </g>
  
      </g>
    </g>
  
</svg>