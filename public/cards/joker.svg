<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF7EE"/>
      <stop offset="100%" stop-color="#F4EFE0"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="560" height="860" rx="34" fill="url(#bgGrad)" stroke="#D8D1BE" stroke-width="3" filter="url(#cardShadow)"/>

  <!-- Corner Joker Labels -->
  <g transform="translate(70, 70)">
    <text x="0" y="40" font-family="'system-ui', -apple-system, sans-serif" font-weight="900" font-size="30" fill="#5B3E6E" letter-spacing="4">J</text>
    <text x="0" y="75" font-family="'system-ui', -apple-system, sans-serif" font-weight="900" font-size="30" fill="#5B3E6E" letter-spacing="4">O</text>
    <text x="0" y="110" font-family="'system-ui', -apple-system, sans-serif" font-weight="900" font-size="30" fill="#5B3E6E" letter-spacing="4">K</text>
    <text x="0" y="145" font-family="'system-ui', -apple-system, sans-serif" font-weight="900" font-size="30" fill="#5B3E6E" letter-spacing="4">E</text>
    <text x="0" y="180" font-family="'system-ui', -apple-system, sans-serif" font-weight="900" font-size="30" fill="#5B3E6E" letter-spacing="4">R</text>
    <circle cx="10" cy="210" r="8" fill="#D6A449"/>
  </g>

  <g transform="translate(530, 830) rotate(180)">
    <text x="0" y="40" font-family="'system-ui', -apple-system, sans-serif" font-weight="900" font-size="30" fill="#5B3E6E" letter-spacing="4">J</text>
    <text x="0" y="75" font-family="'system-ui', -apple-system, sans-serif" font-weight="900" font-size="30" fill="#5B3E6E" letter-spacing="4">O</text>
    <text x="0" y="110" font-family="'system-ui', -apple-system, sans-serif" font-weight="900" font-size="30" fill="#5B3E6E" letter-spacing="4">K</text>
    <text x="0" y="145" font-family="'system-ui', -apple-system, sans-serif" font-weight="900" font-size="30" fill="#5B3E6E" letter-spacing="4">E</text>
    <text x="0" y="180" font-family="'system-ui', -apple-system, sans-serif" font-weight="900" font-size="30" fill="#5B3E6E" letter-spacing="4">R</text>
    <circle cx="10" cy="210" r="8" fill="#D6A449"/>
  </g>

  <!-- Jester Illustration in Center -->
  <g transform="translate(300, 450)">
    <!-- Juggling floating suits arc -->
    <path d="M -180,-150 C -90,-260 90,-260 180,-150" fill="none" stroke="#D6A449" stroke-width="3" stroke-dasharray="6,6"/>
    <g transform="translate(-130, -180) scale(0.65)"><path d="M 0,44 C -4,40 -42,12 -42,-14 C -42,-34 -24,-46 0,-26 C 24,-46 42,-34 42,-14 C 42,12 4,40 0,44 Z" fill="#C53929"/></g>
    <g transform="translate(-45, -230) scale(0.65)"><circle cx="0" cy="-20" r="20" fill="#1A2438"/><circle cx="-20" cy="10" r="20" fill="#1A2438"/><circle cx="20" cy="10" r="20" fill="#1A2438"/><path d="M -8,10 L 8,10 L 14,40 L -14,40 Z" fill="#1A2438"/></g>
    <g transform="translate(45, -230) scale(0.65)"><path d="M 0,-40 L 32,0 L 0,40 L -32,0 Z" fill="#C53929"/></g>
    <g transform="translate(130, -180) scale(0.65)"><path d="M 0,-40 C -20,-16 -38,6 -38,20 C -38,34 -24,40 -12,36 C -4,34 0,24 0,24 C 0,24 4,34 12,36 C 24,40 38,34 38,20 C 38,6 20,-16 0,-40 Z" fill="#1A2438"/><path d="M -8,22 L 8,22 L 14,44 L -14,44 Z" fill="#1A2438"/></g>

    <!-- Dancing Jester Body -->
    <path d="M -60,80 L 60,80 L 40,190 L -40,190 Z" fill="#E06D53" stroke="#1A2438" stroke-width="3"/>
    <path d="M -60,80 L 0,80 L -10,190 L -40,190 Z" fill="#2A6F6D" stroke="#1A2438" stroke-width="3"/>
    <!-- Arms -->
    <path d="M -60,90 Q -130,40 -120,-30" fill="none" stroke="#E06D53" stroke-width="14" stroke-linecap="round"/>
    <path d="M 60,90 Q 130,40 120,-30" fill="none" stroke="#2A6F6D" stroke-width="14" stroke-linecap="round"/>
    <circle cx="-120" cy="-35" r="10" fill="#FCE8D4"/>
    <circle cx="120" cy="-35" r="10" fill="#FCE8D4"/>

    <!-- Legs -->
    <path d="M -25,190 Q -60,250 -30,280" fill="none" stroke="#2A6F6D" stroke-width="14" stroke-linecap="round"/>
    <path d="M 25,190 Q 60,250 85,260" fill="none" stroke="#E06D53" stroke-width="14" stroke-linecap="round"/>

    <!-- Collar Points -->
    <polygon points="-50,60 -70,110 -30,90 0,115 30,90 70,110 50,60" fill="#D6A449" stroke="#1A2438" stroke-width="3"/>

    <!-- Head & Mask -->
    <ellipse cx="0" cy="15" rx="38" ry="42" fill="#FFFFFF" stroke="#1A2438" stroke-width="3"/>
    <!-- Face -->
    <circle cx="-14" cy="10" r="4" fill="#1A2438"/>
    <circle cx="14" cy="10" r="4" fill="#1A2438"/>
    <ellipse cx="0" cy="18" rx="6" ry="4" fill="#C53929"/>
    <path d="M -16,28 Q 0,46 16,28" fill="none" stroke="#1A2438" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Three-Pointed Jester Hat -->
    <path d="M -35,-15 C -80,-50 -110,-10 -90,20 C -70,20 -40,10 -35,-15 Z" fill="#5B3E6E" stroke="#1A2438" stroke-width="3"/>
    <path d="M 0,-20 C -20,-110 20,-110 0,-20 Z" fill="#D6A449" stroke="#1A2438" stroke-width="3"/>
    <path d="M 35,-15 C 80,-50 110,-10 90,20 C 70,20 40,10 35,-15 Z" fill="#2A6F6D" stroke="#1A2438" stroke-width="3"/>
    <circle cx="-90" cy="20" r="6" fill="#D6A449"/>
    <circle cx="0" cy="-105" r="6" fill="#D6A449"/>
    <circle cx="90" cy="20" r="6" fill="#D6A449"/>
  </g>
</svg>