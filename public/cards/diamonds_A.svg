<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF7EE"/>
      <stop offset="100%" stop-color="#F4EFE0"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect x="20" y="20" width="560" height="860" rx="34" fill="url(#bgGrad)" stroke="#D8D1BE" stroke-width="3" filter="url(#cardShadow)"/>

  <!-- Ornate Corner Frame Lines -->
  <!-- Top-Right Frame -->
  <path d="M 430,70 L 520,70 C 526,70 530,74 530,80 L 530,170" fill="none" stroke="#C53929" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="530" cy="70" r="4.5" fill="#C53929"/>
  <!-- Bottom-Left Frame -->
  <path d="M 170,830 L 80,830 C 74,830 70,826 70,820 L 70,730" fill="none" stroke="#C53929" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="70" cy="830" r="4.5" fill="#C53929"/>

  <!-- Top-Left Corner Index -->
  <g transform="translate(68, 60)">
    <text x="0" y="55" font-family="'system-ui', -apple-system, 'Georgia', serif" font-weight="900" font-size="62" fill="#C53929" text-anchor="middle">A</text>
    
    <g transform="translate(0, 95) scale(0.42) ">
      <!-- Outer Diamond Body -->
      <path d="M 0,-48 L 38,0 L 0,48 L -38,0 Z" 
            fill="#C53929" stroke="#8F2218" stroke-width="2"/>
      <!-- Geometric Gem Facets inside -->
      <path d="M 0,-34 L 24,0 L 0,34 L -24,0 Z" fill="#E06D53"/>
      <path d="M 0,-20 L 14,0 L 0,20 L -14,0 Z" fill="#D6A449"/>
      <circle cx="0" cy="0" r="4" fill="#E8C57A"/>
      <circle cx="0" cy="-34" r="2.5" fill="#2A6F6D"/>
      <circle cx="0" cy="34" r="2.5" fill="#2A6F6D"/>
    </g>
  
  </g>

  <!-- Bottom-Right Corner Index (Inverted) -->
  <g transform="translate(532, 840) rotate(180)">
    <text x="0" y="55" font-family="'system-ui', -apple-system, 'Georgia', serif" font-weight="900" font-size="62" fill="#C53929" text-anchor="middle">A</text>
    
    <g transform="translate(0, 95) scale(0.42) ">
      <!-- Outer Diamond Body -->
      <path d="M 0,-48 L 38,0 L 0,48 L -38,0 Z" 
            fill="#C53929" stroke="#8F2218" stroke-width="2"/>
      <!-- Geometric Gem Facets inside -->
      <path d="M 0,-34 L 24,0 L 0,34 L -24,0 Z" fill="#E06D53"/>
      <path d="M 0,-20 L 14,0 L 0,20 L -14,0 Z" fill="#D6A449"/>
      <circle cx="0" cy="0" r="4" fill="#E8C57A"/>
      <circle cx="0" cy="-34" r="2.5" fill="#2A6F6D"/>
      <circle cx="0" cy="34" r="2.5" fill="#2A6F6D"/>
    </g>
  
  </g>

  <!-- Center Artwork -->
  
    <!-- Top Celestial Star -->
    <g transform="translate(300, 190) scale(1.6)">
      <polygon points="0,-16 4.5,-4 16,-4 7,4 10.5,15 0,8 -10.5,15 -7,4 -16,-4 -4.5,-4" fill="#2A6F6D"/>
    </g>
    <!-- Giant Botanical Suit Symbol -->
    
    <g transform="translate(300, 440) scale(2.7) ">
      <!-- Outer Diamond Body -->
      <path d="M 0,-48 L 38,0 L 0,48 L -38,0 Z" 
            fill="#C53929" stroke="#8F2218" stroke-width="2"/>
      <!-- Geometric Gem Facets inside -->
      <path d="M 0,-34 L 24,0 L 0,34 L -24,0 Z" fill="#E06D53"/>
      <path d="M 0,-20 L 14,0 L 0,20 L -14,0 Z" fill="#D6A449"/>
      <circle cx="0" cy="0" r="4" fill="#E8C57A"/>
      <circle cx="0" cy="-34" r="2.5" fill="#2A6F6D"/>
      <circle cx="0" cy="34" r="2.5" fill="#2A6F6D"/>
    </g>
  
    <!-- ACE Label -->
    <text x="300" y="730" font-family="'Georgia', 'Times New Roman', serif" font-weight="900" font-size="34" 
          letter-spacing="10" text-anchor="middle" fill="#C53929">ACE</text>
  
</svg>