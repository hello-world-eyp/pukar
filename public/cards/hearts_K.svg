<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF7EE"/>
      <stop offset="100%" stop-color="#F4EFE0"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect x="20" y="20" width="560" height="860" rx="34" fill="url(#bgGrad)" stroke="#D8D1BE" stroke-width="3" filter="url(#cardShadow)"/>

  <!-- Ornate Corner Frame Lines -->
  <!-- Top-Right Frame -->
  <path d="M 430,70 L 520,70 C 526,70 530,74 530,80 L 530,170" fill="none" stroke="#C53929" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="530" cy="70" r="4.5" fill="#C53929"/>
  <!-- Bottom-Left Frame -->
  <path d="M 170,830 L 80,830 C 74,830 70,826 70,820 L 70,730" fill="none" stroke="#C53929" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="70" cy="830" r="4.5" fill="#C53929"/>

  <!-- Top-Left Corner Index -->
  <g transform="translate(68, 60)">
    <text x="0" y="55" font-family="'system-ui', -apple-system, 'Georgia', serif" font-weight="900" font-size="62" fill="#C53929" text-anchor="middle">K</text>
    
    <g transform="translate(0, 95) scale(0.42) ">
      <!-- Outer Heart Body -->
      <path d="M 0,44 C -4,40 -42,12 -42,-14 C -42,-34 -24,-46 0,-26 C 24,-46 42,-34 42,-14 C 42,12 4,40 0,44 Z" 
            fill="#C53929" stroke="#8F2218" stroke-width="2"/>
      <!-- Botanical Tulip / Vine Motif inside -->
      <path d="M 0,-18 C -12,-30 -26,-14 -16,6 C -8,2 -4,-6 0,-18 Z" fill="#E06D53"/>
      <path d="M 0,-18 C 12,-30 26,-14 16,6 C 8,2 4,-6 0,-18 Z" fill="#E06D53"/>
      <path d="M 0,-6 Q -8,14 0,30 Q 8,14 0,-6 Z" fill="#D6A449"/>
      <circle cx="0" cy="-6" r="4" fill="#E8C57A"/>
      <circle cx="-16" cy="-14" r="2.5" fill="#2A6F6D"/>
      <circle cx="16" cy="-14" r="2.5" fill="#2A6F6D"/>
    </g>
  
  </g>

  <!-- Bottom-Right Corner Index (Inverted) -->
  <g transform="translate(532, 840) rotate(180)">
    <text x="0" y="55" font-family="'system-ui', -apple-system, 'Georgia', serif" font-weight="900" font-size="62" fill="#C53929" text-anchor="middle">K</text>
    
    <g transform="translate(0, 95) scale(0.42) ">
      <!-- Outer Heart Body -->
      <path d="M 0,44 C -4,40 -42,12 -42,-14 C -42,-34 -24,-46 0,-26 C 24,-46 42,-34 42,-14 C 42,12 4,40 0,44 Z" 
            fill="#C53929" stroke="#8F2218" stroke-width="2"/>
      <!-- Botanical Tulip / Vine Motif inside -->
      <path d="M 0,-18 C -12,-30 -26,-14 -16,6 C -8,2 -4,-6 0,-18 Z" fill="#E06D53"/>
      <path d="M 0,-18 C 12,-30 26,-14 16,6 C 8,2 4,-6 0,-18 Z" fill="#E06D53"/>
      <path d="M 0,-6 Q -8,14 0,30 Q 8,14 0,-6 Z" fill="#D6A449"/>
      <circle cx="0" cy="-6" r="4" fill="#E8C57A"/>
      <circle cx="-16" cy="-14" r="2.5" fill="#2A6F6D"/>
      <circle cx="16" cy="-14" r="2.5" fill="#2A6F6D"/>
    </g>
  
  </g>

  <!-- Center Artwork -->
  
      <!-- King Illustration -->
      <g transform="translate(300, 450)">
        <!-- Halo / Arch Frame -->
        <path d="M -140,-210 C -140,-260 140,-260 140,-210 L 140,240 L -140,240 Z" fill="#FAF7EE" stroke="#C53929" stroke-width="3"/>
        <!-- Shoulders / Robe -->
        <path d="M -130,240 Q -140,60 0,60 Q 140,60 130,240 Z" fill="#5B3E6E" stroke="#1A2438" stroke-width="4"/>
        <path d="M -60,60 L 60,60 L 80,240 L -80,240 Z" fill="#E06D53" stroke="#1A2438" stroke-width="3"/>
        <!-- Ermine Collar -->
        <path d="M -70,50 Q 0,110 70,50 Q 0,30 -70,50 Z" fill="#FFFFFF" stroke="#1A2438" stroke-width="3"/>
        <circle cx="-35" cy="55" r="3" fill="#1A2438"/>
        <circle cx="0" cy="70" r="3" fill="#1A2438"/>
        <circle cx="35" cy="55" r="3" fill="#1A2438"/>
        <!-- King Head & Beard -->
        <path d="M -45,-50 C -55,60 55,60 45,-50 Z" fill="#E8C57A"/>
        <!-- Beard -->
        <path d="M -48,-10 C -55,80 55,80 48,-10 C 25,40 -25,40 -48,-10 Z" fill="#6B4423" stroke="#1A2438" stroke-width="3"/>
        <!-- Face -->
        <circle cx="-16" cy="-22" r="4" fill="#1A2438"/>
        <circle cx="16" cy="-22" r="4" fill="#1A2438"/>
        <path d="M -12,8 Q 0,16 12,8" fill="none" stroke="#1A2438" stroke-width="3" stroke-linecap="round"/>
        <!-- Mustache -->
        <path d="M -26,-2 Q 0,12 26,-2 Q 10,2 -26,-2 Z" fill="#523214"/>
        <!-- Crown -->
        <path d="M -45,-50 L -45,-90 L -22,-65 L 0,-100 L 22,-65 L 45,-90 L 45,-50 Z" fill="#D6A449" stroke="#1A2438" stroke-width="3"/>
        <circle cx="0" cy="-70" r="5" fill="#C53929"/>
        <circle cx="-30" cy="-65" r="4" fill="#E8C57A"/>
        <circle cx="30" cy="-65" r="4" fill="#E8C57A"/>
        <!-- Scepter -->
        <g transform="translate(-100, 40)">
          <line x1="0" y1="-180" x2="0" y2="150" stroke="#D6A449" stroke-width="8" stroke-linecap="round"/>
          
    <g transform="translate(0, -190) scale(0.7) ">
      <!-- Outer Heart Body -->
      <path d="M 0,44 C -4,40 -42,12 -42,-14 C -42,-34 -24,-46 0,-26 C 24,-46 42,-34 42,-14 C 42,12 4,40 0,44 Z" 
            fill="#C53929" stroke="#8F2218" stroke-width="2"/>
      <!-- Botanical Tulip / Vine Motif inside -->
      <path d="M 0,-18 C -12,-30 -26,-14 -16,6 C -8,2 -4,-6 0,-18 Z" fill="#E06D53"/>
      <path d="M 0,-18 C 12,-30 26,-14 16,6 C 8,2 4,-6 0,-18 Z" fill="#E06D53"/>
      <path d="M 0,-6 Q -8,14 0,30 Q 8,14 0,-6 Z" fill="#D6A449"/>
      <circle cx="0" cy="-6" r="4" fill="#E8C57A"/>
      <circle cx="-16" cy="-14" r="2.5" fill="#2A6F6D"/>
      <circle cx="16" cy="-14" r="2.5" fill="#2A6F6D"/>
    </g>
  
        </g>
      </g>
    
</svg>