<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF7EE"/>
      <stop offset="100%" stop-color="#F4EFE0"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect x="20" y="20" width="560" height="860" rx="34" fill="url(#bgGrad)" stroke="#D8D1BE" stroke-width="3" filter="url(#cardShadow)"/>

  <!-- Ornate Corner Frame Lines -->
  <!-- Top-Right Frame -->
  <path d="M 430,70 L 520,70 C 526,70 530,74 530,80 L 530,170" fill="none" stroke="#1A2438" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="530" cy="70" r="4.5" fill="#1A2438"/>
  <!-- Bottom-Left Frame -->
  <path d="M 170,830 L 80,830 C 74,830 70,826 70,820 L 70,730" fill="none" stroke="#1A2438" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="70" cy="830" r="4.5" fill="#1A2438"/>

  <!-- Top-Left Corner Index -->
  <g transform="translate(68, 60)">
    <text x="0" y="55" font-family="'system-ui', -apple-system, 'Georgia', serif" font-weight="900" font-size="62" fill="#1A2438" text-anchor="middle">Q</text>
    
    <g transform="translate(0, 95) scale(0.42) ">
      <!-- Outer Spade Body -->
      <path d="M 0,-48 C -22,-20 -44,6 -44,22 C -44,38 -28,44 -14,40 C -4,37 0,26 0,26 C 0,26 4,37 14,40 C 28,44 44,38 44,22 C 44,6 22,-20 0,-48 Z" 
            fill="#1A2438" stroke="#2D3E5E" stroke-width="2"/>
      <!-- Flared Stem -->
      <path d="M -8,28 Q -8,46 -20,52 L 20,52 Q 8,46 8,28 Z" fill="#1A2438"/>
      <!-- Botanical Leaf Filigree inside -->
      <path d="M 0,-34 Q -10,-10 -6,16 Q 0,8 0,-34 Z" fill="#2A6F6D"/>
      <path d="M 0,-34 Q 10,-10 6,16 Q 0,8 0,-34 Z" fill="#2A6F6D"/>
      <path d="M -16,4 Q -28,18 -18,28 Q -8,22 -16,4 Z" fill="#D6A449"/>
      <path d="M 16,4 Q 28,18 18,28 Q 8,22 16,4 Z" fill="#D6A449"/>
      <circle cx="0" cy="2" r="3" fill="#E8C57A"/>
    </g>
  
  </g>

  <!-- Bottom-Right Corner Index (Inverted) -->
  <g transform="translate(532, 840) rotate(180)">
    <text x="0" y="55" font-family="'system-ui', -apple-system, 'Georgia', serif" font-weight="900" font-size="62" fill="#1A2438" text-anchor="middle">Q</text>
    
    <g transform="translate(0, 95) scale(0.42) ">
      <!-- Outer Spade Body -->
      <path d="M 0,-48 C -22,-20 -44,6 -44,22 C -44,38 -28,44 -14,40 C -4,37 0,26 0,26 C 0,26 4,37 14,40 C 28,44 44,38 44,22 C 44,6 22,-20 0,-48 Z" 
            fill="#1A2438" stroke="#2D3E5E" stroke-width="2"/>
      <!-- Flared Stem -->
      <path d="M -8,28 Q -8,46 -20,52 L 20,52 Q 8,46 8,28 Z" fill="#1A2438"/>
      <!-- Botanical Leaf Filigree inside -->
      <path d="M 0,-34 Q -10,-10 -6,16 Q 0,8 0,-34 Z" fill="#2A6F6D"/>
      <path d="M 0,-34 Q 10,-10 6,16 Q 0,8 0,-34 Z" fill="#2A6F6D"/>
      <path d="M -16,4 Q -28,18 -18,28 Q -8,22 -16,4 Z" fill="#D6A449"/>
      <path d="M 16,4 Q 28,18 18,28 Q 8,22 16,4 Z" fill="#D6A449"/>
      <circle cx="0" cy="2" r="3" fill="#E8C57A"/>
    </g>
  
  </g>

  <!-- Center Artwork -->
  
      <!-- Queen Illustration -->
      <g transform="translate(300, 450)">
        <!-- Arch Frame -->
        <path d="M -140,-210 C -140,-260 140,-260 140,-210 L 140,240 L -140,240 Z" fill="#FAF7EE" stroke="#1A2438" stroke-width="3"/>
        <!-- Gown -->
        <path d="M -120,240 Q -130,80 0,80 Q 130,80 120,240 Z" fill="#2A6F6D" stroke="#1A2438" stroke-width="4"/>
        <path d="M -50,90 L 50,90 L 70,240 L -70,240 Z" fill="#2A6F6D" stroke="#1A2438" stroke-width="3"/>
        <!-- Hair -->
        <path d="M -55,-40 C -70,50 -40,110 -35,120 C 0,80 35,120 40,110 C 70,50 55,-40 0,-70 Z" fill="#8B4513"/>
        <!-- Face -->
        <ellipse cx="0" cy="-10" rx="40" ry="46" fill="#FCE8D4" stroke="#1A2438" stroke-width="2.5"/>
        <circle cx="-14" cy="-14" r="3.5" fill="#1A2438"/>
        <circle cx="14" cy="-14" r="3.5" fill="#1A2438"/>
        <path d="M -10,12 Q 0,20 10,12" fill="none" stroke="#C53929" stroke-width="3" stroke-linecap="round"/>
        <!-- Tiara / Crown -->
        <path d="M -35,-48 L -35,-80 L -18,-60 L 0,-88 L 18,-60 L 35,-80 L 35,-48 Z" fill="#D6A449" stroke="#1A2438" stroke-width="3"/>
        <circle cx="0" cy="-64" r="4.5" fill="#2A6F6D"/>
        <!-- Flower Scepter -->
        <g transform="translate(-90, 50)">
          <line x1="0" y1="-160" x2="0" y2="120" stroke="#3A5A40" stroke-width="6" stroke-linecap="round"/>
          
    <g transform="translate(0, -170) scale(0.65) ">
      <!-- Outer Spade Body -->
      <path d="M 0,-48 C -22,-20 -44,6 -44,22 C -44,38 -28,44 -14,40 C -4,37 0,26 0,26 C 0,26 4,37 14,40 C 28,44 44,38 44,22 C 44,6 22,-20 0,-48 Z" 
            fill="#1A2438" stroke="#2D3E5E" stroke-width="2"/>
      <!-- Flared Stem -->
      <path d="M -8,28 Q -8,46 -20,52 L 20,52 Q 8,46 8,28 Z" fill="#1A2438"/>
      <!-- Botanical Leaf Filigree inside -->
      <path d="M 0,-34 Q -10,-10 -6,16 Q 0,8 0,-34 Z" fill="#2A6F6D"/>
      <path d="M 0,-34 Q 10,-10 6,16 Q 0,8 0,-34 Z" fill="#2A6F6D"/>
      <path d="M -16,4 Q -28,18 -18,28 Q -8,22 -16,4 Z" fill="#D6A449"/>
      <path d="M 16,4 Q 28,18 18,28 Q 8,22 16,4 Z" fill="#D6A449"/>
      <circle cx="0" cy="2" r="3" fill="#E8C57A"/>
    </g>
  
        </g>
      </g>
    
</svg>