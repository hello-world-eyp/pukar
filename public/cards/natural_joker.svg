<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="100%" stop-color="#F7F3E8"/>
    </linearGradient>
    <linearGradient id="jokerGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="jokerTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="jokerPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect x="20" y="20" width="560" height="860" rx="34" fill="url(#bgGrad)" stroke="#E5DEC9" stroke-width="3" filter="url(#cardShadow)"/>

  <!-- Ornate Decorative Corner Lines -->
  <path d="M 430,70 L 520,70 C 526,70 530,74 530,80 L 530,170" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="530" cy="70" r="4.5" fill="#D97706"/>
  <path d="M 170,830 L 80,830 C 74,830 70,826 70,820 L 70,730" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="70" cy="830" r="4.5" fill="#D97706"/>

  <!-- Top-Left Corner Index -->
  <g transform="translate(68, 60)">
    <text x="0" y="55" font-family="'system-ui', -apple-system, sans-serif" font-weight="900" font-size="52" fill="#D97706" text-anchor="middle">JK</text>
    <text x="0" y="105" font-size="34" fill="#F59E0B" text-anchor="middle">★</text>
  </g>

  <!-- Bottom-Right Corner Index (Inverted) -->
  <g transform="translate(532, 840) rotate(180)">
    <text x="0" y="55" font-family="'system-ui', -apple-system, sans-serif" font-weight="900" font-size="52" fill="#D97706" text-anchor="middle">JK</text>
    <text x="0" y="105" font-size="34" fill="#F59E0B" text-anchor="middle">★</text>
  </g>

  <!-- Center Floating Suit Symbols -->
  <!-- Top Hearts & Diamonds -->
  <path d="M 220,240 C 205,220 185,220 175,235 C 165,250 175,270 220,305 C 265,270 275,250 265,235 C 255,220 235,220 220,240 Z" fill="#DC2626"/>
  <polygon points="380,210 405,250 380,290 355,250" fill="#EA580C"/>

  <!-- Sides Clubs & Spades -->
  <g transform="translate(180, 430) scale(0.6)">
    <circle cx="0" cy="-24" r="22" fill="#1E293B"/>
    <circle cx="-23" cy="8" r="22" fill="#1E293B"/>
    <circle cx="23" cy="8" r="22" fill="#1E293B"/>
    <circle cx="0" cy="-2" r="16" fill="#1E293B"/>
    <path d="M -8,12 Q -8,44 -20,50 L 20,50 Q 8,44 8,12 Z" fill="#1E293B"/>
  </g>

  <g transform="translate(420, 430) scale(0.6)">
    <path d="M 0,-40 C -35,-5 -35,25 0,10 C 35,25 35,-5 0,-40 Z" fill="#1E293B"/>
    <path d="M -7,6 Q -7,40 -18,48 L 18,48 Q 7,40 7,6 Z" fill="#1E293B"/>
  </g>

  <!-- Jester Mascot Illustration -->
  <g transform="translate(300, 465)">
    <!-- Jester Ruffled Collar -->
    <path d="M -90,-20 L -60,40 L -20,-10 L 0,45 L 20,-10 L 60,40 L 90,-20 Z" fill="url(#jokerGold)" stroke="#92400E" stroke-width="3"/>
    <circle cx="-60" cy="40" r="5" fill="#FDE047"/>
    <circle cx="0" cy="45" r="5" fill="#FDE047"/>
    <circle cx="60" cy="40" r="5" fill="#FDE047"/>

    <!-- Body / Tunic -->
    <path d="M -75,-15 L -90,130 L -20,130 L -10,0 Z" fill="url(#jokerPurple)"/>
    <path d="M 10,0 L 20,130 L 90,130 L 75,-15 Z" fill="url(#jokerTeal)"/>
    <path d="M -15,0 L -20,130 L 20,130 L 15,0 Z" fill="url(#jokerGold)"/>
    <line x1="0" y1="0" x2="0" y2="130" stroke="#78350F" stroke-width="2"/>

    <!-- Belt -->
    <rect x="-80" y="115" width="160" height="18" rx="4" fill="#D97706" stroke="#78350F" stroke-width="2"/>
    <rect x="-18" y="110" width="36" height="28" rx="4" fill="#FDE047" stroke="#78350F" stroke-width="2"/>

    <!-- Jester Head -->
    <ellipse cx="0" cy="-70" rx="42" ry="48" fill="#FEF3C7" stroke="#78350F" stroke-width="3"/>
    
    <!-- Cheerful Face -->
    <path d="M -22,-78 Q -16,-84 -10,-78" fill="none" stroke="#78350F" stroke-width="4" stroke-linecap="round"/>
    <path d="M 10,-78 Q 16,-84 22,-78" fill="none" stroke="#78350F" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-25" cy="-62" r="5" fill="#F87171" opacity="0.6"/>
    <circle cx="25" cy="-62" r="5" fill="#F87171" opacity="0.6"/>
    <!-- Big Smile -->
    <path d="M -24,-55 Q 0,-32 24,-55 Q 0,-42 -24,-55 Z" fill="#DC2626" stroke="#78350F" stroke-width="2"/>
    <path d="M -16,-53 Q 0,-45 16,-53" fill="none" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Tri-Horned Jester Hat -->
    <!-- Left Horn -->
    <path d="M -35,-105 C -75,-130 -115,-130 -125,-85 C -105,-85 -70,-90 -25,-98 Z" fill="url(#jokerPurple)" stroke="#4C1D95" stroke-width="3"/>
    <circle cx="-125" cy="-85" r="9" fill="#FDE047" stroke="#78350F" stroke-width="2"/>

    <!-- Right Horn -->
    <path d="M 35,-105 C 75,-130 115,-130 125,-85 C 105,-85 70,-90 25,-98 Z" fill="url(#jokerTeal)" stroke="#115E59" stroke-width="3"/>
    <circle cx="125" cy="-85" r="9" fill="#FDE047" stroke="#78350F" stroke-width="2"/>

    <!-- Center Horn -->
    <path d="M -28,-102 C -15,-165 15,-165 28,-102 Z" fill="url(#jokerGold)" stroke="#78350F" stroke-width="3"/>
    <circle cx="0" cy="-168" r="10" fill="#FDE047" stroke="#78350F" stroke-width="2"/>

    <!-- Hat Brim -->
    <path d="M -44,-95 Q 0,-115 44,-95 L 42,-85 Q 0,-102 -42,-85 Z" fill="#F59E0B" stroke="#78350F" stroke-width="2"/>
  </g>

  <!-- JOKER Bold Banner Text -->
  <text x="300" y="670" font-family="'system-ui', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#D97706" text-anchor="middle" letter-spacing="8">JOKER</text>
  <text x="300" y="705" font-family="'system-ui', -apple-system, sans-serif" font-weight="900" font-size="20" fill="#B45309" text-anchor="middle" letter-spacing="4">★ WILD CARD ★</text>
</svg>
